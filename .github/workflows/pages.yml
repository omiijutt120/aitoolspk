name: Publish custom-domain website
on:
  workflow_dispatch:
    inputs:
      custom_domain_ready:
        description: 'AItoolsPK.tech DNS and repository Pages custom domain are configured'
        required: true
        type: boolean
        default: false
      expected_sha:
        description: 'Exact reviewed main commit to release (full 40-character SHA)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.custom_domain_ready
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify reviewed release target
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            printf '%s\n' 'Release requires main at the exact reviewed commit.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run launch:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-check-results
          path: |
            reports/repository-check.json
            reports/export-check.json
            reports/launch-check.json
            reports/launch-dependency-audit.json
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
