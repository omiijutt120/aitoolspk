name: Scheduled production monitor

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: scheduled-production-monitor
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve the latest successful Pages release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha="$(gh run list --workflow pages.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'No successful main Pages release SHA was found.' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Render production and validate critical routes
        env:
          EXPECTED_PRODUCTION_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/production-smoke.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: scheduled-production-proof
          path: reports/production-browser/
          retention-days: 30
