name: Read-only production browser smoke
on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: 'Full independently verified successful Pages deployment SHA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-readonly-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render production read-only with normal Chromium sandbox
        env:
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
        run: node scripts/production-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: production-browser-proof
          path: reports/production-browser/
          retention-days: 7
